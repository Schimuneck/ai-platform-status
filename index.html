<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Platform</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23ee0000'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-brand">

    <span class="brand-text">AI Platform</span>
  </div>
  <nav class="sidebar-nav" id="product-nav">
    <p class="nav-label">Products</p>
  </nav>
  <div class="sidebar-footer">
    <p class="sync-time" id="sync-time"></p>
  </div>
</aside>

<main class="content" id="content">
  <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu">☰</button>
  <div class="content-inner" id="content-inner">
    <div class="splash">
      <h1>Welcome</h1>
      <p>Select a product from the sidebar.</p>
    </div>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
